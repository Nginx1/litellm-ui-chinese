name: verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 启动 LiteLLM 容器
        run: |
          docker run -d --name litellm-test -p 4000:4000 \
            -e LITELLM_MASTER_KEY=sk-test123 \
            ghcr.io/berriai/litellm:main-latest \
            --config /dev/null || true
          # 若镜像 tag 变化导致启动失败，可固定版本 tag

      - name: 等待就绪
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4000/health/liveliness || echo 000)
            [ "$code" = "200" ] && echo "ready" && exit 0
            sleep 5
          done
          echo "litellm 未就绪，继续尝试打补丁"

      - name: 推送并执行全部补丁
        run: |
          for f in $(ls | grep '^litellm_zh_patch.*\.py$' | sort -V); do
            docker cp "$f" litellm-test:/tmp/
            docker exec litellm-test python3 "/tmp/$f"
          done

      - name: 验证汉化词条存在
        run: |
          # 容器内静态资源应包含中文词条
          found=$(docker exec litellm-test sh -c \
            'grep -rl "虚拟密钥" /app/.venv/lib/python*/site-packages/litellm/proxy/_experimental/out 2>/dev/null | wc -l')
          echo "包含『虚拟密钥』的文件数: $found"
          [ "$found" -gt 0 ] || { echo "未找到汉化词条"; exit 1; }

      - name: 验证备份文件存在（可回滚）
        run: |
          baks=$(docker exec litellm-test sh -c 'find /app -name "*.en.bak" | wc -l')
          echo ".en.bak 备份数: $baks"
          [ "$baks" -gt 0 ] || { echo "未生成备份"; exit 1; }

      - name: 幂等性验证（重跑不重复替换）
        run: |
          out1=$(docker exec litellm-test python3 /tmp/litellm_zh_patch.py | head -1)
          echo "重跑输出: $out1"
